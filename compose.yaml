# Docker Compose для набора системного аналитика, Portainer отдельно.
# Адрес Kroki передаётся Mermaid при запуске. После изменения .env:
# sudo docker compose up -d --no-build mermaid-editor
name: sa-analyst-suite

services:
  portal:
    image: ${PORTAL_IMAGE:-ghcr.io/denbond007/analyst-portal:1.0.0}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PORTAL_HOST: "${PORTAL_HOST:-${BIND_IP:?Set BIND_IP in .env}}"
      PORTAL_TITLE: "${PORTAL_TITLE:-Инструменты аналитика}"
      PORTAL_SHOW_PORTAINER: "${PORTAL_SHOW_PORTAINER:-true}"
      PORTAINER_URL: "${PORTAINER_URL:-}"
      PORTAINER_PORT: "${PORTAINER_PORT:-9443}"
      MERMAID_PORT: "${MERMAID_PORT:-18081}"
      PLANTUML_PORT: "${PLANTUML_PORT:-18082}"
      SWAGGER_EDITOR_PORT: "${SWAGGER_EDITOR_PORT:-18083}"
      SWAGGER_UI_PORT: "${SWAGGER_UI_PORT:-18084}"
      DRAWIO_PORT: "${DRAWIO_PORT:-18085}"
      DRAWIO_AI_ENABLED: "${DRAWIO_AI_ENABLED:-true}"
      AI_DRAWIO_PORT: "${AI_DRAWIO_PORT:-18088}"
      ASYNCAPI_PORT: "${ASYNCAPI_PORT:-18086}"
      KROKI_PORT: "${KROKI_PORT:-18087}"
      KROKI_URL: "${KROKI_URL:-http://${BIND_IP}:${KROKI_PORT:-18087}}"
    ports:
      - "${BIND_IP}:${PORTAL_PORT:-18080}:8080"

  kroki:
    image: yuzutech/kroki:latest
    restart: unless-stopped
    environment:
      KROKI_SAFE_MODE: SECURE
      KROKI_MERMAID_HOST: kroki-mermaid
      KROKI_BPMN_HOST: kroki-bpmn
      KROKI_EXCALIDRAW_HOST: kroki-excalidraw
    ports:
      - "${BIND_IP:?Set BIND_IP in .env}:${KROKI_PORT:-18087}:8000"
    depends_on:
      - kroki-mermaid
      - kroki-bpmn

  kroki-mermaid:
    image: yuzutech/kroki-mermaid:latest
    restart: unless-stopped
    expose:
      - "8002"

  kroki-bpmn:
    image: yuzutech/kroki-bpmn:latest
    restart: unless-stopped
    expose:
      - "8003"

  # Опционально: sudo docker compose --profile extras up -d
  kroki-excalidraw:
    image: yuzutech/kroki-excalidraw:latest
    restart: unless-stopped
    profiles: ["extras"]
    expose:
      - "8004"

  mermaid-editor:
    image: ${MERMAID_IMAGE:-ghcr.io/denbond007/mermaid-live-editor-runtime:1.0.0}
    environment:
      # URL открывается браузером сотрудника, поэтому используется LAN IP/DNS.
      KROKI_URL: "${KROKI_URL:-http://${BIND_IP:?Set BIND_IP in .env}:${KROKI_PORT:-18087}}"
    restart: unless-stopped
    ports:
      - "${BIND_IP}:${MERMAID_PORT:-18081}:8080"
    depends_on:
      - kroki

  plantuml:
    image: plantuml/plantuml-server:jetty
    restart: unless-stopped
    environment:
      PLANTUML_SECURITY_PROFILE: SANDBOX
    ports:
      - "${BIND_IP}:${PLANTUML_PORT:-18082}:8080"

  swagger-editor:
    image: docker.swagger.io/swaggerapi/swagger-editor:next-v5
    restart: unless-stopped
    ports:
      - "${BIND_IP}:${SWAGGER_EDITOR_PORT:-18083}:80"

  swagger-ui:
    image: docker.swagger.io/swaggerapi/swagger-ui:latest
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /specs/openapi.yaml
      VALIDATOR_URL: none                 # отключает публичный swagger validator
      SUPPORTED_SUBMIT_METHODS: "[]"      # отключает Try it out для безопасности
    volumes:
      - ./specs:/specs:ro
    ports:
      - "${BIND_IP}:${SWAGGER_UI_PORT:-18084}:8080"

  drawio:
    image: jgraph/drawio:latest
    restart: unless-stopped
    environment:
      DRAWIO_CONFIG_FILE: /config/drawio.json
      DRAWIO_LANG: "${DRAWIO_LANG:-ru}"
    volumes:
      - type: bind
        source: ./.local/drawio/drawio.json
        target: /config/drawio.json
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "8080"

  drawio-gateway:
    image: ghcr.io/nginx/nginx-unprivileged:stable-alpine@sha256:2daef144b574804198caccc4041819fa1801ecd5df2252a39646bfa2b1ff3bea
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Used by prepare-drawio-ai.py; never serialized to the browser.
    environment:
      DRAWIO_AI_ENABLED: "${DRAWIO_AI_ENABLED:-true}"
      DRAWIO_AI_BASE_URL: "${DRAWIO_AI_BASE_URL:-${AI_DRAWIO_BASE_URL:-http://host.docker.internal:11434/v1}}"
      DRAWIO_AI_MODEL: "${DRAWIO_AI_MODEL:-${AI_DRAWIO_MODEL:-}}"
      DRAWIO_AI_API_KEY: "${DRAWIO_AI_API_KEY:-${AI_DRAWIO_API_KEY:-}}"
      DRAWIO_AI_MAX_TOKENS: "${DRAWIO_AI_MAX_TOKENS:-${AI_DRAWIO_MAX_OUTPUT_TOKENS:-8192}}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_IP}:${DRAWIO_PORT:-18085}:8080"
    volumes:
      - type: bind
        source: ./.local/drawio/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/drawio/ai-runtime.js
        target: /etc/nginx/drawio-ai-runtime.js
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - drawio
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  ai-drawio:
    image: ${AI_DRAWIO_IMAGE:-ghcr.io/dayuanjiang/next-ai-draw-io:0.5.0}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1001,gid=1001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      # 0.5.0 uses the OpenAI protocol adapter with an explicitly selected URL.
      AI_PROVIDER: openai
      AI_MODEL: "${AI_DRAWIO_MODEL:-}"
      OPENAI_BASE_URL: "${AI_DRAWIO_BASE_URL:-http://host.docker.internal:11434/v1}"
      OPENAI_API_KEY: "${AI_DRAWIO_API_KEY:-}"
      MAX_OUTPUT_TOKENS: "${AI_DRAWIO_MAX_OUTPUT_TOKENS:-8192}"
      NEXT_TELEMETRY_DISABLED: "1"
      ALLOW_PRIVATE_URLS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_IP}:${AI_DRAWIO_PORT:-18088}:3000"
    volumes:
      - ai_drawio_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  asyncapi:
    image: asyncapi/studio:latest
    restart: unless-stopped
    ports:
      - "${BIND_IP}:${ASYNCAPI_PORT:-18086}:80"

volumes:
  ai_drawio_data:
