apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-drawio
  namespace: sa-analyst-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-drawio
  template:
    metadata:
      labels:
        app: ai-drawio
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ai-drawio
          image: ghcr.io/dayuanjiang/next-ai-draw-io:0.5.0
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: AI_PROVIDER
              value: openai
            - name: AI_MODEL
              value: ''
            - name: OPENAI_BASE_URL
              value: http://127.0.0.1:11434/v1
            - name: OPENAI_API_KEY
              value: ''
            - name: MAX_OUTPUT_TOKENS
              value: '8192'
            - name: NEXT_TELEMETRY_DISABLED
              value: '1'
            - name: ALLOW_PRIVATE_URLS
              value: 'true'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.next/cache
            - name: data
              mountPath: /app/data
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-drawio
  namespace: sa-analyst-local
spec:
  type: ClusterIP
  selector:
    app: ai-drawio
  ports:
    - name: http
      port: 3000
      targetPort: http
