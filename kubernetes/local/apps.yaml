# Готовые образы для локального ПК; .env не читается.
# Сначала создайте analyst-openapi из specs/openapi.yaml по инструкции.
# AI не настроен; /app/data Next AI Draw.io временный (emptyDir).
apiVersion: v1
kind: ConfigMap
metadata:
  name: drawio-settings
  namespace: sa-analyst-local
data:
  drawio.json: |
    {"enableAi": false, "aiActions": []}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: sa-analyst-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      automountServiceAccountToken: false
      containers:
        - name: portal
          image: ghcr.io/denbond007/analyst-portal:1.0.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: PORTAL_HOST
              value: 127.0.0.1
            - name: PORTAL_SHOW_PORTAINER
              value: 'false'
            - name: DRAWIO_AI_ENABLED
              value: 'false'
            - name: KROKI_URL
              value: http://127.0.0.1:18087
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: sa-analyst-local
spec:
  type: ClusterIP
  selector:
    app: portal
  ports:
    - name: http
      port: 8080
      targetPort: http
---
