map $uri $portal_cache_control {
  default "no-cache";
  /runtime-config.js "no-store";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  etag off;
  if_modified_since off;

  add_header Cache-Control $portal_cache_control always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

  location = /runtime-config.js {
    default_type application/javascript;
    alias /tmp/portal-runtime-config.js;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
