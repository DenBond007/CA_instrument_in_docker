name: Test and publish Mermaid runtime image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version, for example 1.0.0
        required: true
        default: '1.0.0'
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'docker/**'
      - 'tests/**'
      - 'scripts/**'
      - 'compose*.yaml'
      - 'package*.json'
      - 'playwright.config.mjs'
      - '.dockerignore'
      - '.github/workflows/publish-mermaid.yml'

permissions:
  contents: read

concurrency:
  group: mermaid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check runtime configuration and shell syntax
        run: |
          npm test
          for script in scripts/*.sh; do bash -n "$script"; done
          sh -n docker/mermaid/40-runtime-config.sh
          BIND_IP=127.0.0.1 docker compose config --quiet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image for browser tests
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/mermaid/Dockerfile
          load: true
          tags: local/mermaid-live-editor-runtime:test
          cache-from: type=gha,scope=mermaid-runtime
          cache-to: type=gha,mode=max,scope=mermaid-runtime
      - run: npx playwright install --with-deps chromium
      - name: Verify the same image with two Kroki addresses
        run: npm run test:browser
        env:
          MERMAID_TEST_IMAGE: local/mermaid-live-editor-runtime:test

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Determine image name and version
        id: image
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version=${INPUT_VERSION:-${GITHUB_REF_NAME#v}}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]+([.-][a-z0-9]+)*)?$ ]]; then
            echo 'Expected a version such as 1.0.0 or 1.0.0-rc.1' >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mermaid-live-editor-runtime"
          {
            echo "name=$image"
            echo "version=$version"
            echo 'tags<<TAGS'
            echo "$image:$version"
            echo "$image:sha-$GITHUB_SHA"
            if [[ "$version" != *-* ]]; then echo "$image:latest"; fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image for AMD64 and ARM64
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/mermaid/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=mermaid-runtime
          cache-to: type=gha,mode=max,scope=mermaid-runtime
      - name: Record published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Published `%s:%s`\n\nDigest: `%s`\n' "$IMAGE" "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
